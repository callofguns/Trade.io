<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1618">
<meta name="description" content="Trade.io - live card and company markets, moved by every trade.">
<title>Trade.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar__row">
    <span class="wordmark">Trade.io</span>
    <button class="icon-btn" id="theme-toggle" aria-label="Switch to day market">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="networth">
    <span class="eyebrow">Net worth</span>
    <span class="num networth__value" id="networth">$0.00</span>
    <div class="networth__meta">
      <span id="networth-delta">&mdash;</span>
      <span>&middot;</span>
      <span>Cash <span class="num" id="cash">$0.00</span></span>
    </div>
  </div>

  <!-- The tape. aria-hidden: it repeats data already on screen, and a feed
       that rewrites itself every second is noise to a screen reader. -->
  <div class="tape" id="tape" aria-hidden="true"></div>
</header>

<main id="main">
  <section class="view" id="view-market" data-active="true" aria-labelledby="market-title">
    <div class="view__head">
      <h1 class="view__title" id="market-title">Companies</h1>
      <span class="view__note" id="market-note">Founded by players</span>
    </div>
    <div class="stack" id="market-list">
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </section>

  <section class="view" id="view-cards" aria-labelledby="cards-title">
    <div class="view__head">
      <h1 class="view__title" id="cards-title">Auction house</h1>
      <span class="view__note" id="cards-note">&mdash;</span>
    </div>
    <div class="stack" id="cards-list"></div>
  </section>

  <section class="view" id="view-holdings" aria-labelledby="holdings-title">
    <div class="view__head">
      <h1 class="view__title" id="holdings-title">Holdings</h1>
      <span class="view__note" id="holdings-note">&mdash;</span>
    </div>
    <div id="holdings-body"></div>
  </section>

  <section class="view" id="view-activity" aria-labelledby="activity-title">
    <div class="view__head">
      <h1 class="view__title" id="activity-title">Activity</h1>
      <span class="view__note">Last 40 trades</span>
    </div>
    <div class="feed" id="activity-body"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-tab="market" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M3 17l5-6 4 4 5-7 4 5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Market
  </button>
  <button class="tab" data-tab="cards">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <rect x="4" y="3" width="12" height="17" rx="2"/><path d="M17 6l3 1.5-3.5 11" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Cards
  </button>
  <button class="tab" data-tab="holdings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-linecap="round"/>
    </svg>
    Holdings
  </button>
  <button class="tab" data-tab="activity">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M3 12h4l3-7 4 14 3-7h4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Activity
  </button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="bundle.js"></script>
</body>
</html>
